<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Transfer Function Console</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div id="app">
    <header id="app-bar">
      <div id="app-bar-left">
        <svg id="app-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M3 12c2-5 6-8 9-8s7 3 9 8c-2 5-6 8-9 8s-7-3-9-8Z" />
          <circle cx="12" cy="12" r="3" fill="currentColor" stroke="none" />
        </svg>
        <span id="app-title">TF<span class="thin">/RL</span> CONSOLE</span>
      </div>
      <div id="app-bar-right">
        <button id="commands-help-btn" class="btn btn-ghost btn-icon" aria-label="Command reference" data-tooltip="Command reference">?</button>
        <span id="session-indicator"><span class="dot"></span>LOKALE SITZUNG</span>
      </div>
    </header>

    <div id="main">
      <section id="image-panel">
        <div id="dataset-row">
          <label id="dataset-select-label">SAMPLE</label>
          <div id="dataset-select" class="select-root">
            <button type="button" id="dataset-select-trigger" class="select-trigger"
                    aria-haspopup="listbox" aria-expanded="false" aria-labelledby="dataset-select-label dataset-select-value">
              <span id="dataset-select-value">—</span>
              <svg class="select-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <div id="dataset-select-popover" class="select-popover" role="listbox" aria-labelledby="dataset-select-label" hidden></div>
          </div>
        </div>

        <div id="viewport">
          <div id="single-view">
            <div id="viewport-frame">
              <div id="vtk-viewer" aria-label="interactive local volume viewer"></div>
              <div id="viewer-status" role="status" aria-live="polite">Loading local volume...</div>
              <div id="viewer-error" role="alert" hidden></div>
              <img id="current-image" alt="rendered volume" />
            </div>
            <div id="nav">
              <button id="back-btn" class="btn btn-outline btn-icon" aria-label="Previous step" data-tooltip="Previous step">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
              </button>
              <span id="step-counter">1 / 1</span>
              <button id="forward-btn" class="btn btn-outline btn-icon" aria-label="Next step" data-tooltip="Next step">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
              </button>
              <button id="reset-btn" class="btn btn-secondary btn-sm" data-tooltip="Reset the transfer function to its default">Reset</button>
            </div>
          </div>

          <div id="compare-view" hidden>
            <div id="compare-header">
              <span id="compare-goal">&mdash;</span>
              <button id="compare-close" class="btn btn-secondary btn-sm" data-tooltip="Back to the single view">Close</button>
            </div>
            <div id="compare-columns"></div>
          </div>
        </div>

        <div id="telemetry" data-readout="visibility">
          <div class="telem-item" data-tissue="skeleton"><span class="telem-label">SKELETT</span><span class="telem-value" id="telem-skeleton">—</span></div>
          <div class="telem-item" data-tissue="lungs"><span class="telem-label">LUNGE</span><span class="telem-value" id="telem-lungs">—</span></div>
          <div class="telem-item" data-tissue="soft"><span class="telem-label">WEICHGEW.</span><span class="telem-value" id="telem-soft">—</span></div>
          <div class="telem-item" data-tissue="vessels"><span class="telem-label">GEFÄSSE</span><span class="telem-value" id="telem-vessels">—</span></div>
        </div>
      </section>

      <section id="chat-panel">
        <div id="messages">
          <div id="empty-state">
            <p>Describe what you want to see.</p>
            <p class="hint">e.g. "show only the lungs", "a bit less soft tissue", "brighten the bone"</p>
          </div>
        </div>

        <div id="composer">
          <div id="toolbar">
            <div id="parser-toggle-group" class="toggle-group" data-toggle-group="parser" role="radiogroup" aria-label="Command parser">
              <button type="button" class="toggle-item" data-value="rule" data-state="off">rule</button>
              <button type="button" class="toggle-item" data-value="llm" data-state="on">llm</button>
            </div>
            <button id="search-toggle-btn" class="toggle" data-active="false" data-tooltip="Hill-climb search">search</button>
            <div id="search-options" hidden>
              <input id="steps-input" type="number" value="10" min="1" max="200" aria-label="Search steps" title="Visibility evaluations spent hill-climbing, not UI steps -- a full sweep needs about 25" />
            </div>
            <button id="policy-toggle-btn" class="toggle" data-active="false" data-tooltip="Answer with the trained policy">policy</button>
            <button id="compare-btn" class="btn btn-outline btn-sm" data-tooltip="Answer four ways and compare">compare</button>
            <button id="sweep-btn" class="btn btn-outline btn-sm" data-tooltip="Run 20 sampled instructions and show the spread">sweep 20</button>
          </div>

          <div id="input-row">
            <button id="mic-btn" aria-label="Record voice command" data-tooltip="Push to talk">
              <svg id="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="2" width="6" height="12" rx="3"/>
                <path d="M5 10a7 7 0 0 0 14 0"/>
                <path d="M12 19v3"/>
              </svg>
              <div id="mic-waveform" hidden>
                <span></span><span></span><span></span><span></span><span></span>
              </div>
            </button>
            <textarea id="text-input" rows="1" placeholder="a bit less soft tissue"></textarea>
            <button id="send-btn" aria-label="Send" data-tooltip="Send" disabled>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
            </button>
          </div>
        </div>
      </section>
    </div>

    <dialog id="commands-modal" aria-labelledby="commands-modal-title">
      <div id="commands-modal-header">
        <h2 id="commands-modal-title">Command Reference</h2>
        <button id="commands-modal-close" class="btn btn-ghost btn-icon" aria-label="Close" data-tooltip="Close">×</button>
      </div>
      <div id="commands-list"></div>
    </dialog>

    <div id="toast-viewport" role="region" aria-live="polite" aria-label="Notifications"></div>
  </div>
  <script src="https://unpkg.com/vtk.js@25.11.0"></script>
  <script src="/static/viewer.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
