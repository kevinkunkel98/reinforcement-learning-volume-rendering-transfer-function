<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Transfer Function Console</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div id="app">
    <header id="app-bar">
      <div id="app-bar-left">
        <svg id="app-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M3 12c2-5 6-8 9-8s7 3 9 8c-2 5-6 8-9 8s-7-3-9-8Z" />
          <circle cx="12" cy="12" r="3" fill="currentColor" stroke="none" />
        </svg>
        <span id="app-title">TF<span class="thin">/RL</span> CONSOLE</span>
      </div>
      <div id="app-bar-right">
        <button id="commands-help-btn" class="icon-btn" aria-label="Command reference" title="Command reference">?</button>
        <span id="session-indicator"><span class="dot"></span>LOKALE SITZUNG</span>
      </div>
    </header>

    <div id="main">
      <section id="image-panel">
        <div id="dataset-row">
          <label for="dataset-select">SAMPLE</label>
          <select id="dataset-select"></select>
        </div>

        <div id="viewport">
          <div id="single-view">
            <div id="viewport-frame">
              <img id="current-image" alt="rendered volume" />
              <svg class="corner corner-tl" viewBox="0 0 24 24"><path d="M2,14 L2,2 L14,2" /></svg>
              <svg class="corner corner-tr" viewBox="0 0 24 24"><path d="M10,2 L22,2 L22,14" /></svg>
              <svg class="corner corner-br" viewBox="0 0 24 24"><path d="M22,10 L22,22 L10,22" /></svg>
              <svg class="corner corner-bl" viewBox="0 0 24 24"><path d="M14,22 L2,22 L2,10" /></svg>
              <div id="overlay-tl" class="overlay-readout"></div>
              <div id="overlay-br" class="overlay-readout"></div>
            </div>
            <div id="nav">
              <button id="back-btn" class="icon-btn" aria-label="Previous step">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
              </button>
              <span id="step-counter">1 / 1</span>
              <button id="forward-btn" class="icon-btn" aria-label="Next step">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
              </button>
              <button id="reset-btn" class="pill-btn" title="Reset the transfer function to its default">Reset</button>
            </div>
          </div>
          <div id="judge-view" hidden>
            <div class="pair">
              <div><p>Before</p><img id="before-image" alt="before" /></div>
              <div><p>After</p><img id="after-image" alt="after" /></div>
            </div>
            <p id="judge-progress"></p>
            <div id="judge-buttons">
              <button id="worse-btn" class="pill-btn bad">Worse</button>
              <button id="better-btn" class="pill-btn good">Better</button>
            </div>
          </div>
        </div>

        <div id="telemetry">
          <div class="telem-item" data-tissue="air"><span class="telem-label">LUFT</span><span class="telem-value" id="telem-air">—</span></div>
          <div class="telem-item" data-tissue="fat"><span class="telem-label">FETT</span><span class="telem-value" id="telem-fat">—</span></div>
          <div class="telem-item" data-tissue="soft"><span class="telem-label">WEICHGEW.</span><span class="telem-value" id="telem-soft">—</span></div>
          <div class="telem-item" data-tissue="spongy"><span class="telem-label">SPONGIOSA</span><span class="telem-value" id="telem-spongy">—</span></div>
          <div class="telem-item" data-tissue="bone"><span class="telem-label">KORTIKALIS</span><span class="telem-value" id="telem-bone">—</span></div>
        </div>
      </section>

      <section id="chat-panel">
        <div id="messages">
          <div id="empty-state">
            <p>Describe what you want to see.</p>
            <p class="hint">e.g. "increase opacity for bone strongly"</p>
          </div>
        </div>

        <div id="composer">
          <div id="toolbar">
            <button id="parser-toggle" class="chip" data-value="rule" title="Command parser">rule parser</button>
            <button id="search-toggle-btn" class="chip" data-active="false" title="Hill-climb search">search</button>
            <div id="search-options" hidden>
              <button id="evaluator-toggle" class="chip chip-quiet" data-value="objective" title="Evaluator">objective</button>
              <input id="steps-input" type="number" value="10" min="1" max="50" aria-label="Search steps" />
            </div>
          </div>

          <div id="input-row">
            <button id="mic-btn" aria-label="Record voice command" title="Push to talk">
              <svg id="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="2" width="6" height="12" rx="3"/>
                <path d="M5 10a7 7 0 0 0 14 0"/>
                <path d="M12 19v3"/>
              </svg>
              <div id="mic-waveform" hidden>
                <span></span><span></span><span></span><span></span><span></span>
              </div>
            </button>
            <textarea id="text-input" rows="1" placeholder="increase opacity for bone strongly"></textarea>
            <button id="send-btn" aria-label="Send" disabled>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
            </button>
          </div>
        </div>
      </section>
    </div>

    <dialog id="commands-modal">
      <div id="commands-modal-header">
        <h2>Command Reference</h2>
        <button id="commands-modal-close" class="icon-btn" aria-label="Close">×</button>
      </div>
      <div id="commands-list"></div>
    </dialog>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
