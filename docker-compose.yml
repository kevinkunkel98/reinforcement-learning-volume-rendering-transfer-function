services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./out:/app/out
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama
    # Uncomment to pass a Linux GPU through to VTK's volume mapper.
    # Requires nvidia-container-toolkit for Nvidia, or the host's Mesa DRI
    # node for integrated/AMD GPUs -- confirmed working offscreen without
    # this (falls back to software rendering), see render.py's MAPPER_NAME.
    # devices:
    #   - /dev/dri:/dev/dri

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    # Uncomment for Nvidia GPU passthrough (requires nvidia-container-toolkit
    # on the host):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  ollama-models:
